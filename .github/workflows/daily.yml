name: Daily edition

on:
  schedule:
    # 22:00 UTC = 06:00 Asia/Shanghai; GitHub may delay a few minutes, still well before 08:00.
    - cron: "0 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily.yml"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git identity
        run: |
          git config user.name "gnss-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate and publish edition
        run: python scripts/daily_update.py --per-domain 4 --min-score 45 --days 21

      - name: Show result
        run: git log -1 --stat | head -30
