name: Research radar

on:
  schedule:
    - cron: "17 16,19,22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily.yml"
      - "scripts/**"
      - "assets/**"
      - "data/domains.json"
      - "data/settings.json"
      - "data/learning.json"
      - "data/editions/**"
      - "data/deep_reads/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: research-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore source cache
        uses: actions/cache@v4
        with:
          path: .cache/deepseek
          key: deepseek-v2-${{ github.run_id }}
          restore-keys: deepseek-v2-

      - name: Configure git identity
        run: |
          git config user.name "gnss-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          url = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/pages"
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  site = json.load(response)
          except urllib.error.HTTPError as error:
              print("::error::Pages configuration could not be read: HTTP %d." % error.code)
              raise SystemExit(1)
          if site.get("build_type") != "workflow":
              print("::error::Select GitHub Actions under Settings > Pages > Build and deployment > Source, then rerun this workflow. Paid retrieval has not started.")
              raise SystemExit(1)
          print("Pages publishing source: GitHub Actions")
          PY

      - name: Retrieve and interpret
        if: github.event_name != 'push'
        id: update
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/daily_update.py --no-push

      - name: Build saved content
        run: python scripts/build_site.py

      - name: Validate generated site
        run: python scripts/validate_site.py

      - name: Save daily data and usage
        run: |
          git add -A -- index.html 404.html daily archive papers topics library learn about data/status.json data/editions data/usage
          if ! git diff --cached --quiet; then
            git commit -m "Research radar update $(TZ=Asia/Shanghai date +%F)"
            git push origin HEAD
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site
        run: |
          python scripts/build_site.py --output _site
          python scripts/validate_site.py --root _site --public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the public deployment
        run: python scripts/verify_deployment.py

      - name: Report update status
        if: always()
        run: |
          if [ "${{ steps.update.outcome }}" = "skipped" ]; then
            printf '%s\n' 'Content-only publication: built saved data without retrieval or AI calls. Daily retrieval status on the site is unchanged.' >> "$GITHUB_STEP_SUMMARY"
          else
            python scripts/daily_update.py --show-status >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.update.outcome }}" = "failure" ]; then
            exit 1
          fi
